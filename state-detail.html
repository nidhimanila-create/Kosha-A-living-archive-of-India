<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>State Experience — Kosha</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">

    <style>

        /* =========================================
           CATEGORY CARDS
        ========================================== */

        .card {
            position: relative;
            overflow: hidden;
            min-height: 410px;
            cursor: pointer;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            border-radius: 16px;
        }


        /* Dark overlay over image */

        .card__overlay {
            position: absolute;
            inset: 0;

            background: linear-gradient(
                to top,
                rgba(5, 8, 18, 0.98),
                rgba(5, 8, 18, 0.65),
                rgba(5, 8, 18, 0.15)
            );

            z-index: 1;
        }


        /* Text on card */

        .card__content {
            position: absolute;

            left: 30px;
            right: 30px;
            bottom: 30px;

            z-index: 2;
        }


        /* Card hover effect */

        .card:hover {
            transform: translateY(-5px);
            transition: 0.3s ease;
        }


        /* =========================================
           CATEGORY MODAL
        ========================================== */

        .category-modal {
            width: min(1000px, 90vw);
            max-height: 85vh;

            overflow-y: auto;

            padding: 40px;
        }


        /* Items inside modal */

        .experience-container {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 24px;

            margin-top: 30px;
        }


        .experience-item {
            border-radius: 12px;

            overflow: hidden;

            background: rgba(255, 255, 255, 0.06);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            padding-bottom: 20px;
        }


        .experience-image {
            width: 100%;
            height: 180px;

            object-fit: cover;

            display: block;
        }


        .experience-item h3 {
            margin: 18px 18px 10px;

            font-family:
                "Playfair Display",
                serif;
        }


        .experience-item p {
            margin: 0 18px 18px;

            line-height: 1.6;

            opacity: 0.8;
        }


        .experience-item .btn {
            margin-left: 18px;
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .category-modal {
                padding: 25px 18px;
            }

            .experience-container {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: 350px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <div id="navbar-slot"></div>



    <!-- =========================================
         STATE HERO
    ========================================== -->

    <section
        class="section"
        style="padding-top: 140px;"
    >

        <div class="container">

            <p class="eyebrow reveal">
                EXPLORE BY STATE
            </p>


            <h1
                id="state-name"
                class="reveal"
            >
                Loading...
            </h1>


            <p
                id="state-description"
                class="lede reveal"
                style="margin-top: 16px;"
            >
            </p>

        </div>

    </section>



    <!-- =========================================
         CULTURAL CATEGORIES
    ========================================== -->

    <section class="section">

        <div class="container">

            <p class="eyebrow reveal">
                DISCOVER
            </p>


            <h2 class="reveal">
                Explore the culture
            </h2>


            <div
                class="card-grid"
                style="margin-top: 40px;"
            >


                <!-- =================================
                     HERITAGE
                ================================== -->

                <div
                    class="card reveal"
                    id="heritage-card"
                    onclick="openCategory('heritage')"
                >

                    <div class="card__overlay"></div>

                    <div class="card__content">

                        <span class="tag">
                            01
                        </span>

                        <h3
                            class="card__title"
                            style="margin-top: 12px;"
                        >
                            Heritage
                        </h3>

                        <p
                            class="card__desc"
                            id="heritage"
                        >
                        </p>

                    </div>

                </div>



                <!-- =================================
                     PERFORMING ARTS
                ================================== -->

                <div
                    class="card reveal"
                    id="arts-card"
                    onclick="openCategory('arts')"
                >

                    <div class="card__overlay"></div>

                    <div class="card__content">

                        <span class="tag">
                            02
                        </span>

                        <h3
                            class="card__title"
                            style="margin-top: 12px;"
                        >
                            Performing Arts
                        </h3>

                        <p
                            class="card__desc"
                            id="arts"
                        >
                        </p>

                    </div>

                </div>



                <!-- =================================
                     CRAFTS
                ================================== -->

                <div
                    class="card reveal"
                    id="crafts-card"
                    onclick="openCategory('crafts')"
                >

                    <div class="card__overlay"></div>

                    <div class="card__content">

                        <span class="tag">
                            03
                        </span>

                        <h3
                            class="card__title"
                            style="margin-top: 12px;"
                        >
                            Crafts
                        </h3>

                        <p
                            class="card__desc"
                            id="crafts"
                        >
                        </p>

                    </div>

                </div>



                <!-- =================================
                     CUISINE
                ================================== -->

                <div
                    class="card reveal"
                    id="cuisine-card"
                    onclick="openCategory('cuisine')"
                >

                    <div class="card__overlay"></div>

                    <div class="card__content">

                        <span class="tag">
                            04
                        </span>

                        <h3
                            class="card__title"
                            style="margin-top: 12px;"
                        >
                            Cuisine
                        </h3>

                        <p
                            class="card__desc"
                            id="cuisine"
                        >
                        </p>

                    </div>

                </div>



                <!-- =================================
                     FESTIVALS
                ================================== -->

                <div
                    class="card reveal"
                    id="festivals-card"
                    onclick="openCategory('festivals')"
                >

                    <div class="card__overlay"></div>

                    <div class="card__content">

                        <span class="tag">
                            05
                        </span>

                        <h3
                            class="card__title"
                            style="margin-top: 12px;"
                        >
                            Festivals
                        </h3>

                        <p
                            class="card__desc"
                            id="festivals"
                        >
                        </p>

                    </div>

                </div>



                <!-- =================================
                     LITERATURE
                ================================== -->

                <div
                    class="card reveal"
                    id="literature-card"
                    onclick="openCategory('literature')"
                >

                    <div class="card__overlay"></div>

                    <div class="card__content">

                        <span class="tag">
                            06
                        </span>

                        <h3
                            class="card__title"
                            style="margin-top: 12px;"
                        >
                            Literature
                        </h3>

                        <p
                            class="card__desc"
                            id="literature"
                        >
                        </p>

                    </div>

                </div>


            </div>

        </div>

    </section>



    <!-- =========================================
         CATEGORY DETAILS MODAL
    ========================================== -->

    <div
        class="modal-backdrop"
        id="categoryModal"
        style="display: none;"
    >

        <div class="modal category-modal">


            <!-- CLOSE BUTTON -->

            <button
                class="modal__close"
                onclick="closeCategory()"
            >
                ✕
            </button>


            <!-- CATEGORY LABEL -->

            <p
                class="eyebrow"
                id="modal-category"
            >
            </p>


            <!-- CATEGORY TITLE -->

            <h2 id="modal-title">
            </h2>


            <!-- CATEGORY ITEMS -->

            <div
                id="modal-description"
                class="experience-container"
            >
            </div>


        </div>

    </div>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <div id="footer-slot"></div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="include.js"></script>

    <script src="reveal.js"></script>

    <script src="states.js"></script>


</body>

</html>
