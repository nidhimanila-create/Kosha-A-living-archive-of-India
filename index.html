<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kosha — The Living Treasury of India</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Shared Kosha stylesheet -->
    <link rel="stylesheet" href="styles.css">


    <style>

        /* =========================================================
           KOSHA — LANDING PAGE
           Person 1 — Opening Experience
           
           IMPORTANT:
           The shared styles.css is NOT modified.
           These styles are specific to index.html.
           ========================================================= */


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #0A0E1A;
        }


        /* =========================================================
           CINEMATIC INTRO
           ========================================================= */

        .landing-intro {

            position: relative;

            width: 100%;
            height: 100vh;
            min-height: 650px;

            overflow: hidden;

            background: #08070a;
        }


        /* Individual background slides */

        .intro-slide {

            position: absolute;

            inset: 0;

            opacity: 0;

            transform: scale(1.06);

            background-size: cover;
            background-position: center;

            transition:
                opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1),
                transform 7s cubic-bezier(0.22, 1, 0.36, 1);
        }


        .intro-slide.active {

            opacity: 1;

            transform: scale(1);
        }


        /* Dark cinematic overlay */

        .intro-overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(5, 5, 8, 0.42) 0%,
                    rgba(5, 5, 8, 0.16) 35%,
                    rgba(5, 5, 8, 0.76) 100%
                );

            z-index: 2;
        }


        /* Cinematic vignette */

        .intro-vignette {

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.65) 100%
                );

            z-index: 3;

            pointer-events: none;
        }


        /* =========================================================
           KOSHA BRAND
           ========================================================= */

        .intro-brand {

            position: absolute;

            top: 34px;
            left: 42px;

            z-index: 10;

            font-family: var(--font-display);

            font-size: 1.15rem;

            letter-spacing: 0.25em;

            color: rgba(243, 239, 230, 0.9);

            text-transform: uppercase;
        }


        /* =========================================================
           SLIDE CAPTION
           ========================================================= */

        .intro-caption {

            position: absolute;

            left: 50%;
            bottom: 145px;

            transform: translateX(-50%);

            z-index: 10;

            width: min(90%, 700px);

            text-align: center;

            pointer-events: none;
        }


        .intro-caption-title {

            font-family: var(--font-body);

            font-size: 0.75rem;

            font-weight: 600;

            letter-spacing: 0.38em;

            color: var(--gold);

            text-transform: uppercase;

            opacity: 0;

            transform: translateY(12px);

            transition:
                opacity 0.8s ease,
                transform 0.8s var(--ease);
        }


        .intro-caption-title.visible {

            opacity: 1;

            transform: translateY(0);
        }


        /* Gold line underneath caption */

        .intro-line {

            width: 58px;
            height: 2px;

            margin: 20px auto 0;

            background: var(--gold);

            transform: scaleX(0);

            transform-origin: center;

            transition:
                transform 1s var(--ease);
        }


        .intro-line.visible {

            transform: scaleX(1);
        }


        /* =========================================================
           SKIP BUTTON
           ========================================================= */

        .skip-button {

            position: absolute;

            bottom: 52px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 20;

            border: none;

            background: transparent;

            color: rgba(243, 239, 230, 0.78);

            font-family: var(--font-body);

            font-size: 0.68rem;

            font-weight: 500;

            letter-spacing: 0.35em;

            text-transform: uppercase;

            padding: 12px 20px;

            cursor: pointer;

            transition:
                color var(--dur-fast) var(--ease),
                transform var(--dur-fast) var(--ease);
        }


        .skip-button:hover {

            color: var(--gold-soft);

            transform:
                translateX(-50%)
                translateY(-2px);
        }


        /* =========================================================
           SLIDESHOW PROGRESS
           ========================================================= */

        .intro-progress {

            position: absolute;

            left: 50%;
            bottom: 95px;

            transform: translateX(-50%);

            z-index: 20;

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .progress-dot {

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: rgba(243, 239, 230, 0.32);

            transition:
                width 0.5s ease,
                background 0.5s ease;
        }


        .progress-dot.active {

            width: 25px;

            border-radius: 10px;

            background: var(--gold);
        }


        /* =========================================================
           WELCOME TO INDIA
           ========================================================= */

        .welcome-screen {

            position: relative;

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(212, 169, 78, 0.08),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 15% 80%,
                    rgba(224, 149, 76, 0.06),
                    transparent 35%
                ),
                var(--bg-primary);
        }


        .welcome-screen::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent 30%,
                    rgba(212, 169, 78, 0.025),
                    transparent 70%
                );

            pointer-events: none;
        }


        .welcome-inner {

            position: relative;

            width: min(90%, 900px);

            text-align: center;

            padding: 120px 20px 100px;
        }


        /* WELCOME TO */

        .welcome-eyebrow {

            margin: 0 0 25px;

            color: var(--gold);

            font-family: var(--font-body);

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.38em;

            text-transform: uppercase;
        }


        /* INDIA */

        .welcome-title {

            margin: 0;

            font-family: var(--font-display);

            font-size: clamp(5rem, 14vw, 10rem);

            font-weight: 500;

            line-height: 0.9;

            letter-spacing: -0.025em;

            color: var(--gold-soft);
        }


        .welcome-description {

            max-width: 700px;

            margin: 42px auto 0;

            font-family: var(--font-body);

            font-size: clamp(0.95rem, 1.5vw, 1.15rem);

            line-height: 1.8;

            color: var(--text-secondary);
        }


        .welcome-question {

            margin: 55px auto 38px;

            font-family: var(--font-display);

            font-style: italic;

            font-size: clamp(1.45rem, 3vw, 2.1rem);

            color: var(--text-primary);
        }


        /* =========================================================
           EXPLORE INDIA BUTTON
           ========================================================= */

        .explore-button {

            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 300px;

            padding: 18px 38px;

            border: 1px solid var(--border-strong);

            color: var(--gold-soft);

            font-family: var(--font-body);

            font-size: 0.78rem;

            font-weight: 600;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            background: transparent;

            text-decoration: none;

            transition:
                background 0.5s var(--ease),
                border-color 0.5s var(--ease),
                color 0.5s var(--ease),
                transform 0.5s var(--ease);
        }


        .explore-button span {

            margin-left: 16px;

            font-size: 1rem;

            transition:
                transform 0.5s var(--ease);
        }


        .explore-button:hover {

            background: rgba(212, 169, 78, 0.08);

            border-color: var(--gold);

            color: var(--gold-soft);

            transform: translateY(-3px);
        }


        .explore-button:hover span {

            transform: translateX(7px);
        }


        /* =========================================================
           CHOOSE YOUR PATH
           ========================================================= */

        .paths-section {

            position: relative;

            min-height: 100vh;

            padding: 140px 0 160px;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(224, 149, 76, 0.07),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(212, 169, 78, 0.05),
                    transparent 35%
                ),
                var(--bg-primary);
        }


        .paths-header {

            max-width: var(--max-width);

            margin: 0 auto;

            padding: 0 var(--space-md);
        }


        .paths-chapter {

            margin: 0 0 24px;

            color: var(--gold);

            font-family: var(--font-body);

            font-size: 0.72rem;

            font-weight: 600;

            letter-spacing: 0.3em;

            text-transform: uppercase;
        }


        .paths-title {

            margin: 0;

            font-family: var(--font-display);

            font-size: clamp(3.5rem, 8vw, 7rem);

            font-weight: 500;

            color: var(--text-primary);

            line-height: 0.95;
        }


        .paths-subtitle {

            margin: 28px 0 0;

            font-family: var(--font-display);

            font-style: italic;

            font-size: clamp(1.2rem, 2.2vw, 1.6rem);

            color: var(--text-secondary);
        }


        /* =========================================================
           PATH GRID
           ========================================================= */

        .path-grid {

            max-width: 1100px;

            margin: 95px auto 0;

            padding: 0 var(--space-md);

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            column-gap: 100px;

            row-gap: 70px;
        }


        .path-card {

            position: relative;

            display: block;

            padding: 10px 0 25px;

            border-bottom:
                1px solid rgba(212, 169, 78, 0.12);

            text-decoration: none;

            transition:
                transform 0.6s var(--ease),
                border-color 0.5s var(--ease);
        }


        .path-card:hover {

            transform: translateX(8px);

            border-color: var(--border-strong);
        }


        .path-icon {

            display: block;

            width: 36px;
            height: 36px;

            margin-bottom: 20px;

            color: var(--gold);

            font-size: 1.5rem;

            line-height: 36px;
        }


        .path-title {

            margin: 0 0 7px;

            font-family: var(--font-display);

            font-size: clamp(1.6rem, 3vw, 2.2rem);

            color: var(--text-primary);
        }


        .path-description {

            margin: 0;

            font-family: var(--font-body);

            font-size: 0.88rem;

            color: var(--text-secondary);
        }


        .path-arrow {

            position: absolute;

            right: 0;
            bottom: 26px;

            color: var(--gold);

            opacity: 0;

            transform: translateX(-10px);

            transition:
                opacity 0.4s ease,
                transform 0.4s var(--ease);
        }


        .path-card:hover .path-arrow {

            opacity: 1;

            transform: translateX(0);
        }


        /* =========================================================
           END MESSAGE
           ========================================================= */

        .paths-end {

            max-width: 1100px;

            margin: 130px auto 0;

            padding: 0 var(--space-md);
        }


        .paths-end-line {

            width: 60px;
            height: 1px;

            margin-bottom: 25px;

            background: var(--gold);
        }


        .paths-end-text {

            margin: 0;

            font-family: var(--font-display);

            font-style: italic;

            font-size: 1.1rem;

            color: var(--text-muted);
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 800px) {

            .intro-brand {

                top: 25px;
                left: 24px;
            }


            .intro-caption {

                bottom: 135px;
            }


            .welcome-title {

                font-size:
                    clamp(4rem, 20vw, 7rem);
            }


            .welcome-inner {

                padding-top: 100px;
            }


            .explore-button {

                min-width: 260px;
            }


            .path-grid {

                grid-template-columns: 1fr;

                column-gap: 0;

                row-gap: 48px;

                margin-top: 65px;
            }


            .paths-section {

                padding-top: 110px;
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 500px) {

            .intro-brand {

                font-size: 0.95rem;

                letter-spacing: 0.18em;
            }


            .intro-caption {

                bottom: 125px;
            }


            .skip-button {

                bottom: 35px;
            }


            .intro-progress {

                bottom: 78px;
            }


            .welcome-description {

                font-size: 0.9rem;
            }


            .welcome-question {

                margin-top: 42px;
            }


            .explore-button {

                min-width: 230px;

                padding: 16px 25px;

                letter-spacing: 0.2em;
            }


            .path-card {

                padding-bottom: 22px;
            }


            .path-arrow {

                display: none;
            }
        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;

                scroll-behavior: auto !important;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         SHARED NAVBAR
         ========================================================= -->

    <div id="navbar-slot"></div>


    <!-- =========================================================
         CINEMATIC OPENING
         ========================================================= -->

    <section
        class="landing-intro"
        id="intro">


        <!-- KOSHA LOGO / BRAND -->

        <div class="intro-brand">
            KOSHA
        </div>


        <!-- =====================================================
             SLIDES
             ===================================================== -->


        <div
            class="intro-slide active"
            data-title="INDIA"
            style="
                background-image:
                url('https://images.unsplash.com/photo-1532664189809-02133fee698d?w=2200&q=85');
            ">
        </div>


        <div
            class="intro-slide"
            data-title="HERITAGE"
            style="
                background-image:
                url('https://images.unsplash.com/photo-1514222134-b57cbb8ce073?w=2200&q=85');
            ">
        </div>


        <div
            class="intro-slide"
            data-title="TEXTILES"
            style="
                background-image:
                url('https://images.unsplash.com/photo-1601055283742-8f3d3f6e8c66?w=2200&q=85');
            ">
        </div>


        <div
            class="intro-slide"
            data-title="FESTIVALS"
            style="
                background-image:
                url('https://images.unsplash.com/photo-1604079628040-94301bb21b91?w=2200&q=85');
            ">
        </div>


        <div
            class="intro-slide"
            data-title="CRAFT"
            style="
                background-image:
                url('https://images.unsplash.com/photo-1590736969955-71cc94901144?w=2200&q=85');
            ">
        </div>


        <!-- =====================================================
             CINEMATIC OVERLAYS
             ===================================================== -->

        <div class="intro-overlay"></div>

        <div class="intro-vignette"></div>


        <!-- =====================================================
             IMAGE CAPTION
             ===================================================== -->

        <div class="intro-caption">

            <div
                class="intro-caption-title"
